# Wi-Fi upload is optional and OFF by default (offline firmware, no radio
# linked). `*-wifi` aliases add `--features wifi`.
# Boards (exactly one board feature per build; see README.txt):
#   X4  : cargo build-x4   -> riscv32imc,  esp32c3
#   C61 : cargo build-c61  -> riscv32imac, esp32c61: builds both images, the full
#         offline firmware (pulp-os-c61) and the bring-up image (pulp-os-c61-boot)
# The default [build] target below is the X4 one for backwards compatibility;
# the aliases always pass --target explicitly, and build.rs rejects a board /
# target mismatch.
[alias]
build-x4  = "build --release --target riscv32imc-unknown-none-elf --features board-x4"
run-x4    = "run --release --target riscv32imc-unknown-none-elf --features board-x4"
check-x4  = "check --release --target riscv32imc-unknown-none-elf --features board-x4"
build-x4-wifi = "build --release --target riscv32imc-unknown-none-elf --features board-x4,wifi"
run-x4-wifi   = "run --release --target riscv32imc-unknown-none-elf --features board-x4,wifi"
build-c61 = "build --release --target riscv32imac-unknown-none-elf --features board-onepage-c61"
run-c61   = "run --release --target riscv32imac-unknown-none-elf --features board-onepage-c61 --bin pulp-os-c61"
run-c61-boot = "run --release --target riscv32imac-unknown-none-elf --features board-onepage-c61 --bin pulp-os-c61-boot"
build-c61-wifi = "build --release --target riscv32imac-unknown-none-elf --features board-onepage-c61,wifi"
run-c61-wifi   = "run --release --target riscv32imac-unknown-none-elf --features board-onepage-c61,wifi --bin pulp-os-c61"
check-c61 = "check --release --target riscv32imac-unknown-none-elf --features board-onepage-c61"
build-c61-partial = "build --release --target riscv32imac-unknown-none-elf --features board-onepage-c61,partial-refresh"
run-c61-partial   = "run --release --target riscv32imac-unknown-none-elf --features board-onepage-c61,partial-refresh --bin pulp-os-c61"
check-c61-partial = "check --release --target riscv32imac-unknown-none-elf --features board-onepage-c61,partial-refresh"

# Host-side tests. The default [build] target is bare-metal RISC-V, so every
# host command selects `host-tuple` explicitly. The root build-std = [alloc, core]
# is merged (not replaced) by --config, and a core-only build-std collides with the
# test harness's sysroot core (E0152), so std+test are added.
test-board-logic = ["test", "-p", "pulp-board-logic", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']
test-host        = ["test", "-p", "pulp-host", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']
test-tools       = ["test", "-p", "pulp-fontpack", "-p", "pulp-fontconv", "--features", "pulp-fontpack/builder", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']
# ELF / dependency-graph checks and golden wire traces; needs the images of `task build`
test-harness     = ["test", "-p", "board-harness", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']
# English TXT/EPUB regression (own workspace, real reader sources against a hardware shim)
test-reader-regression = ["test", "--manifest-path", "reader-regression/Cargo.toml", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']
host-preview     = ["run", "--locked", "-p", "pulp-host", "--bin", "host-preview", "--target", "host-tuple", "--config", 'unstable.build-std=["std","test"]']

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3"

# OnePage C61: BSP bring-up uses flash 40 MHz DIO / 16 MB (80 MHz flash causes
# image-hash boot loops on this board, see bsp_onepage_c61/README.md). Needs an
# espflash that knows esp32c61 (>= 4.4.0; 4.3.0 rejects the chip).
[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c61 --flash-mode dio --flash-freq 40mhz --flash-size 16mb"

[env]
ESP_LOG="info"

[build]
rustflags = [
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]

[package]
name         = "pulp-kernel"
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
authors      = ["Hans Martin <hansmrtn@users.noreply.github.com>"]
description  = "no_std async kernel for pulp-os (scheduling, drivers, storage, EPD rendering)"
license      = "MIT"
repository   = "https://github.com/hansmrtn/pulp-os"

[dependencies]
# HAL-free board logic (pin map, GPIO27 power-order state machine); host-tested
pulp-board-logic = { path = "../board-logic" }
# font pack directory name, to notice writes to the packs
pulp-fontpack = { path = "../fontpack" }
esp-hal.workspace             = true
embassy-executor.workspace    = true
embassy-time.workspace        = true
embassy-futures.workspace     = true
embassy-sync.workspace        = true
embedded-hal.workspace        = true
embedded-hal-async.workspace  = true
embedded-hal-bus.workspace    = true
embedded-graphics-core.workspace = true
embedded-graphics.workspace   = true
embedded-sdmmc.workspace      = true
critical-section.workspace    = true
static_cell.workspace         = true
nb.workspace                  = true
log.workspace                 = true
esp-alloc.workspace          = true

# chip features follow the build target (see the root Cargo.toml comment)
[target.riscv32imc-unknown-none-elf.dependencies]
esp-hal   = { workspace = true, features = ["esp32c3"] }
esp-alloc = { workspace = true, features = ["esp32c3"] }

[target.riscv32imac-unknown-none-elf.dependencies]
esp-hal   = { workspace = true, features = ["esp32c61"] }
esp-alloc = { workspace = true, features = ["esp32c61"] }

# exactly one board feature must be enabled (see src/lib.rs)
[features]
default = []
board-x4          = []
board-onepage-c61 = []
# Wi-Fi build of the firmware (forwarded by the root `wifi` feature): selects the
# smaller C61 internal heap plan and the matching MemoryBudget.
wifi              = []
# OnePage C61: differential partial refresh for `Redraw::Partial` (off: every
# refresh is full).
partial-refresh   = []
# OnePage C61: a full refresh that only paints (first frame, app change) runs the
# short faked-90 C waveform; ghosting clears and the sleep screen stay on the real
# temperature one. Off: every full refresh uses the real temperature.
fast-full-refresh = []
# OnePage C61: the sleep wallpaper (SLEEP.BMP) is shown in 4 gray levels (anti-aliased
# look, ~4 s refresh in the sleep path) instead of dithered black and white.
gray-wallpaper    = []
# CJK pack read counters and one log line per preparation (forwarded by the root
# `sd-metrics` feature). Off: no counters, no clock reads, no log lines.
sd-metrics        = []

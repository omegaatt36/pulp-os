# Software acceptance of the firmware (everything that runs without a board).
# `task` alone lists the tasks; `task acceptance` runs all of them.
#
# The four images are built into target/accept/<image>/ (one CARGO_TARGET_DIR each);
# the ELF checks of `cargo test-harness` read them from there and fail if one is missing.
# Host-side test commands are cargo aliases (.cargo/config.toml), usable on their own:
#   cargo test-board-logic | test-host | test-tools | test-harness | test-reader-regression
#   cargo host-preview -- --help
version: '3'

vars:
  ACCEPT: target/accept
  C61_ELF: '{{.ACCEPT}}/c61/riscv32imac-unknown-none-elf/release/pulp-os-c61'
  C61_WIFI_ELF: '{{.ACCEPT}}/c61-wifi/riscv32imac-unknown-none-elf/release/pulp-os-c61'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the X4 and C61 images, offline and with Wi-Fi, into target/accept/
    cmds:
      - CARGO_TARGET_DIR={{.ACCEPT}}/x4 cargo build-x4 --locked
      - CARGO_TARGET_DIR={{.ACCEPT}}/x4-wifi cargo build-x4-wifi --locked
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61 cargo build-c61 --locked
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61-wifi cargo build-c61-wifi --locked

  test:
    desc: Host tests (board logic, reader, font tools, English TXT/EPUB regression)
    cmds:
      - cargo test-board-logic
      - cargo test-host --locked
      - cargo test-tools --locked
      - cargo test-reader-regression

  verify:
    desc: ELF, dependency-graph and memory-budget checks of the built images
    deps: [build]
    cmds:
      - cargo test-harness --locked

  fmt:
    desc: cargo fmt --check
    # -p, not --all: --all also checks path dependencies (vendor/smol-epub)
    cmds:
      - cargo fmt -p pulp-os -p pulp-kernel -p pulp-board-logic -p board-harness -- --check

  acceptance:
    desc: Everything above, then the hardware status
    cmds:
      - task: build
      - task: test
      - task: verify
      - task: fmt
      - cmd: |
          echo
          echo "Software acceptance passed. NOT verified on hardware: every item in"
          echo "specs/hardware-acceptance.md is UNVERIFIED until run on a OnePage C61."
        silent: true

  size:
    desc: Section sizes of the C61 images (offline and Wi-Fi)
    vars:
      LLVM_SIZE:
        sh: |
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-size"
    deps: [build]
    cmds:
      - '{{.LLVM_SIZE}} -A {{.C61_ELF}}'
      - '{{.LLVM_SIZE}} -A {{.C61_WIFI_ELF}}'

  stack:
    desc: Static worst-case stack depth of the offline C61 image
    deps: [build]
    cmds:
      - cargo run -p board-harness --bin stack-analyzer --target host-tuple --config 'unstable.build-std=["std","test"]' -- {{.C61_ELF}}

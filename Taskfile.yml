version: '3'

vars:
  ACCEPT: target/accept
  C61_ELF: '{{.ACCEPT}}/c61/riscv32imac-unknown-none-elf/release/pulp-os-c61'
  C61_WIFI_ELF: '{{.ACCEPT}}/c61-wifi/riscv32imac-unknown-none-elf/release/pulp-os-c61'
  C61_PARTIAL_ELF: '{{.ACCEPT}}/c61-partial/riscv32imac-unknown-none-elf/release/pulp-os-c61'
  C61_PARTIAL_WIFI_ELF: '{{.ACCEPT}}/c61-partial-wifi/riscv32imac-unknown-none-elf/release/pulp-os-c61'
  IANSUI_URL: https://raw.githubusercontent.com/ButTaiwan/iansui/9d9a8e68bf1e138dd91e562eeff28d95bca33196/fonts/ttf/Iansui-Regular.ttf
  IANSUI_SHA256: 7f1aa62e9dcbf40d0ce41a5d3f1e5ea602e66c295778ac6fefb6b84d8ed08bd5
  CJK_URL: https://github.com/huthief/BailuKai/releases/download/20260928/BailuKai-Medium.ttf
  CJK_SHA256: f9ba6f763112b19342c94add915e5e6ac6dccd52e097247f3481f037b5bc21be

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the C61 release matrix (offline, Wi-Fi, partial, partial+Wi-Fi) into target/accept/
    cmds:
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61 cargo build --release --locked --target riscv32imac-unknown-none-elf
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61-wifi cargo build --release --locked --target riscv32imac-unknown-none-elf --features wifi
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61-partial cargo build --release --locked --target riscv32imac-unknown-none-elf --features partial-refresh
      - CARGO_TARGET_DIR={{.ACCEPT}}/c61-partial-wifi cargo build --release --locked --target riscv32imac-unknown-none-elf --features partial-refresh,wifi

  font:
    desc: Fetch the pinned BailuKai Medium 20260928 font and build its SD bundle
    cmds:
      - task: font-source
      - cargo run -p pulp-fontconv --release --locked --target host-tuple --config 'unstable.build-std=["std","test"]' -- bundle

  font-source:
    desc: Fetch and verify the selected CJK source font
    status:
      - echo "{{.CJK_SHA256}}  target/BailuKai-Medium.ttf" | shasum -a 256 -c --status -
    cmds:
      - mkdir -p target
      - curl -fsSL -o target/BailuKai-Medium.ttf {{.CJK_URL}}
      - echo "{{.CJK_SHA256}}  target/BailuKai-Medium.ttf" | shasum -a 256 -c -

  font-iansui:
    desc: Fetch the pinned Iansui fixture for the converter regression tests
    status:
      - echo "{{.IANSUI_SHA256}}  Iansui-Regular.ttf" | shasum -a 256 -c --status -
    cmds:
      - curl -fsSL -o Iansui-Regular.ttf {{.IANSUI_URL}}
      - echo "{{.IANSUI_SHA256}}  Iansui-Regular.ttf" | shasum -a 256 -c -

  test:
    desc: Host workspace tests independent of firmware images (harness checks run in verify)
    deps: [font-iansui]
    env:
      IANSUI_REQUIRED: '1'
    cmds:
      - cargo test-all

  verify:
    desc: ELF, dependency-graph and memory-budget checks of the built images
    deps: [build]
    cmds:
      - cargo test-harness --locked

  fmt:
    desc: cargo fmt --check
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: clippy on the firmware crates (all feature builds) and the host crates with their tests; warnings fail
    cmds:
      - cargo clippy --no-deps --release --locked --target riscv32imac-unknown-none-elf -p pulp-os -p pulp-kernel -p pulp-board-logic -p pulp-fontpack -- -D warnings
      - cargo clippy --no-deps --release --locked --target riscv32imac-unknown-none-elf --features partial-refresh,wifi -p pulp-os -p pulp-kernel -- -D warnings
      - cargo clippy --no-deps --all-targets --locked --features pulp-fontpack/builder -p pulp-host -p pulp-fontpack -p pulp-fontconv -p pulp-board-logic --target host-tuple --config 'unstable.build-std=["std","test"]' -- -D warnings
      # the harness tests compile kernel sources against a shim HAL, so lints there do not
      # describe the firmware; only its binaries are checked
      - cargo clippy --no-deps --bins --locked -p board-harness --target host-tuple --config 'unstable.build-std=["std","test"]' -- -D warnings

  acceptance:
    desc: Full software acceptance pipeline (build, test, verify, fmt, clippy)
    cmds:
      - task: build
      - task: test
      - task: verify
      - task: fmt
      - task: clippy
      - cmd: |
          echo
          echo "Software acceptance passed."
        silent: true

  size:
    desc: Section sizes of the C61 images (offline, Wi-Fi, partial refresh, partial + Wi-Fi)
    vars:
      LLVM_SIZE:
        sh: |
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-size"
    deps: [build]
    cmds:
      - '{{.LLVM_SIZE}} -A {{.C61_ELF}}'
      - '{{.LLVM_SIZE}} -A {{.C61_WIFI_ELF}}'
      - '{{.LLVM_SIZE}} -A {{.C61_PARTIAL_ELF}}'
      - '{{.LLVM_SIZE}} -A {{.C61_PARTIAL_WIFI_ELF}}'

  stack:
    desc: Static worst-case stack depth of the offline C61 image
    deps: [build]
    cmds:
      - cargo run -p board-harness --bin stack-analyzer --target host-tuple --config 'unstable.build-std=["std","test"]' -- {{.C61_ELF}}

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>pulp manager</title>
        <link rel="icon" href="data:," />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                background: #f5f5f0;
                color: #222;
                max-width: 540px;
                margin: 0 auto;
                padding: 16px;
            }
            h1 {
                font-size: 1.4em;
                margin-bottom: 12px;
            }
            #auth {
                margin-bottom: 16px;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                background: #fff;
            }
            #auth p { margin: 6px 0 10px; font-size: 0.85em; color: #666; }
            #token { width: 100%; padding: 8px; margin-bottom: 8px; font-family: monospace; }
            #auth button { padding: 6px 12px; cursor: pointer; }
            #drop {
                border: 2px dashed #bbb;
                border-radius: 8px;
                padding: 32px 16px;
                text-align: center;
                cursor: pointer;
                background: #fff;
                transition:
                    border-color 0.2s,
                    background 0.2s;
                margin-bottom: 12px;
            }
            #drop.over {
                border-color: #333;
                background: #eef6ee;
            }
            #drop p {
                pointer-events: none;
            }
            #drop .hint {
                color: #888;
                font-size: 0.85em;
                margin-top: 6px;
            }
            #fin {
                display: none;
            }
            #bar {
                height: 6px;
                border-radius: 3px;
                background: #ddd;
                margin-bottom: 4px;
                overflow: hidden;
            }
            #bar > div {
                height: 100%;
                width: 0;
                background: #3a3;
                border-radius: 3px;
                transition: width 0.15s;
            }
            #status {
                font-size: 0.85em;
                color: #666;
                min-height: 1.2em;
                margin-bottom: 12px;
                word-break: break-all;
            }
            #status.err {
                color: #c33;
            }
            #status.ok {
                color: #2a2;
            }
            #time-status {
                font-size: 0.8em;
                color: #666;
                margin-bottom: 12px;
            }
            #time-status.err { color: #c33; }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.9em;
            }
            th {
                text-align: left;
                border-bottom: 1px solid #ccc;
                padding: 6px 4px;
                color: #777;
                font-weight: 500;
            }
            td {
                padding: 6px 4px;
                border-bottom: 1px solid #e5e5e5;
            }
            .sz {
                text-align: right;
                white-space: nowrap;
                color: #888;
            }
            .del {
                background: none;
                border: 1px solid #ccc;
                color: #c33;
                border-radius: 4px;
                padding: 2px 8px;
                cursor: pointer;
                font-size: 0.85em;
            }
            .del:hover {
                background: #c33;
                color: #fff;
            }
            #empty {
                color: #999;
                padding: 24px 0;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>pulp manager</h1>

        <section id="auth">
            <form id="auth-form">
                <label for="token">Session token</label>
                <p>Scan the QR code on the device, or enter both token lines shown on its screen.</p>
                <input id="token" type="text" autocomplete="off" autocapitalize="none"
                    spellcheck="false" placeholder="32 hexadecimal characters" required />
                <button type="submit">Connect</button>
            </form>
        </section>

        <div id="drop" onclick="fin.click()">
            <p>Drop files here or tap to browse</p>
            <p class="hint">.epub &middot; .txt &middot; any file</p>
        </div>
        <input type="file" id="fin" multiple onchange="upload(this.files)" />
        <div id="bar"><div id="fill"></div></div>
        <div id="status"></div>
        <div id="time-status" role="status"></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th class="sz">Size</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
        <div id="empty"></div>

        <script>
            var D = document,
                drop = D.getElementById("drop"),
                fin = D.getElementById("fin"),
                list = D.getElementById("list"),
                fill = D.getElementById("fill"),
                st = D.getElementById("status"),
                empty = D.getElementById("empty"),
                queue = [],
                active = null,
                uploadsPending = 0,
                busy = 0,
                listing = null,
                retryTimer = null,
                handoffTimer = null,
                generation = 0,
                timeReady = false,
                sessionToken = "",
                auth = D.getElementById("auth"),
                tokenInput = D.getElementById("token"),
                timeStatus = D.getElementById("time-status");

            function s(msg, cls) {
                st.textContent = msg;
                st.className = cls || "";
            }

            function ready() {
                if (sessionToken) return true;
                auth.hidden = false;
                s("Enter the session token shown on the device", "err");
                return false;
            }

            function resetSession() {
                // Invalidate callbacks before abort(), which can fire synchronously.
                generation++;
                var previous = active;
                active = null;
                queue = [];
                uploadsPending = 0;
                busy = 0;
                listing = null;
                clearTimeout(retryTimer);
                retryTimer = null;
                clearTimeout(handoffTimer);
                handoffTimer = null;
                sessionToken = "";
                timeReady = false;
                timeStatus.textContent = "";
                fill.style.width = "0";
                if (previous) previous.x.abort();
                waitForDevice();
            }

            function rejected(x) {
                if (x.status !== 403) return false;
                resetSession();
                auth.hidden = false;
                s("Session token is incorrect or expired. Enter the token currently shown on the device.", "err");
                return true;
            }

            function authorize(value) {
                var token = value.replace(/\s/g, "").toLowerCase();
                if (!/^[0-9a-f]{32}$/.test(token)) {
                    s("Enter all 32 hexadecimal characters from the device", "err");
                    return false;
                }
                resetSession();
                sessionToken = token;
                auth.hidden = true;
                tokenInput.value = "";
                s("");
                calibrateTime();
                return true;
            }

            D.getElementById("auth-form").onsubmit = function (event) {
                event.preventDefault();
                authorize(tokenInput.value);
            };

            function fmt(b) {
                if (b < 1024) return b + " B";
                if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
                return (b / 1048576).toFixed(1) + " MB";
            }

            // HTTP EOF arrives before the device finishes closing and listening again.
            function waitForDevice() {
                clearTimeout(handoffTimer);
                var session = generation;
                handoffTimer = setTimeout(function () {
                    if (session !== generation) return;
                    handoffTimer = null;
                    pump();
                }, 100);
            }

            // The device accepts one connection at a time, including mutations.
            function pump() {
                if (!sessionToken || active || handoffTimer !== null) return;
                scheduleListing();
                if (!queue.length) return;
                var job = queue.shift(),
                    session = generation,
                    x = new XMLHttpRequest(),
                    done = false;
                active = { x: x, job: job };
                function current() {
                    return !done && session === generation && active && active.x === x;
                }
                function finish(reason) {
                    if (!current()) return;
                    done = true;
                    active = null;
                    waitForDevice();
                    if (reason === "load" && rejected(x)) return;
                    try {
                        job.finish(x, reason);
                    } finally {
                        if (session === generation) {
                            if (job.path === "/upload" && !uploadsPending) load();
                            else pump();
                        }
                    }
                }
                x.open(job.method, job.path);
                x.timeout = job.timeout;
                x.setRequestHeader("X-Pulp-Token", sessionToken);
                if (job.contentType) x.setRequestHeader("Content-Type", job.contentType);
                x.onload = function () { finish("load"); };
                x.onerror = function () { finish("error"); };
                x.ontimeout = function () { finish("timeout"); };
                x.onabort = function () { finish("abort"); };
                if (job.progress) x.upload.onprogress = function (event) {
                    if (current()) job.progress(event);
                };
                if (job.start) job.start();
                if (current()) x.send(job.body);
            }

            function scheduleListing() {
                if (!listing || listing.state !== "pending" || uploadsPending) return;
                var work = listing;
                work.state = "queued";
                queue.push({
                    path: "/files", method: "GET", timeout: 5000,
                    start: function () { work.state = "active"; },
                    finish: function (x, reason) {
                        if ((reason === "error" || reason === "timeout") && work.retries > 0) {
                            work.state = "retry";
                            var session = generation;
                            retryTimer = setTimeout(function () {
                                if (session !== generation || listing !== work) return;
                                retryTimer = null;
                                work.retries--;
                                work.delay = Math.min(work.delay * 2, 3000);
                                work.state = "pending";
                                pump();
                            }, work.delay);
                            return;
                        }
                        listing = null;
                        if (reason !== "load") {
                            empty.textContent = "Connection error";
                            return;
                        }
                        if (x.status !== 200) {
                            list.innerHTML = "";
                            empty.textContent = "Could not list files";
                            return;
                        }
                        var files;
                        try {
                            files = JSON.parse(x.responseText);
                            if (!Array.isArray(files) || !files.every(function (f) {
                                return f && typeof f.name === "string" &&
                                    typeof f.size === "number" && isFinite(f.size) && f.size >= 0;
                            })) throw new Error("Invalid file list");
                        } catch (e) {
                            empty.textContent = "Bad response";
                            return;
                        }
                        list.innerHTML = "";
                        empty.textContent = files.length ? "" : "No files on device";
                        files.forEach(function (n) {
                            var tr = D.createElement("tr"),
                                td1 = D.createElement("td"),
                                td2 = D.createElement("td"),
                                td3 = D.createElement("td"),
                                btn = D.createElement("button");
                            tr.dataset.filename = n.name;
                            td1.textContent = n.name;
                            td2.textContent = fmt(n.size);
                            td2.className = "sz";
                            btn.textContent = "\u00d7";
                            btn.className = "del";
                            btn.title = "Delete " + n.name;
                            btn.onclick = function () { del(n.name); };
                            td3.appendChild(btn);
                            tr.appendChild(td1);
                            tr.appendChild(td2);
                            tr.appendChild(td3);
                            list.appendChild(tr);
                        });
                    }
                });
            }

            function load(retries, delay) {
                if (!ready()) return;
                if (!listing) listing = {
                    retries: retries === undefined ? 3 : retries,
                    delay: delay === undefined ? 400 : delay,
                    state: "pending"
                };
                pump();
            }

            function del(name) {
                if (!ready() || !confirm("Delete " + name + "?")) return;
                queue.push({
                    path: "/delete", method: "POST", timeout: 35000,
                    contentType: "text/plain", body: name,
                    finish: function (x, reason) {
                        if (reason === "load" && x.status === 200) {
                            // A preceding refresh may have replaced the clicked row.
                            Array.prototype.slice.call(list.children).forEach(function (row) {
                                if (row.dataset.filename === name) row.remove();
                            });
                            if (!list.children.length) empty.textContent = "No files on device";
                            s(name + " deleted", "ok");
                        } else s("Delete failed: " + (reason === "load" ?
                            (x.responseText || "server error") : reason === "timeout" ?
                            "request timed out" : reason === "abort" ? "request cancelled" : "network error"), "err");
                    }
                });
                pump();
            }

            function upload(files) {
                if (!ready() || !files.length) return;
                // A queued refresh must wait until all files, including later additions, drain.
                if (listing && listing.state === "queued") {
                    queue = queue.filter(function (job) { return job.path !== "/files"; });
                    listing.state = "pending";
                }
                for (var i = 0; i < files.length; i++) enqueueUpload(files[i]);
                fin.value = "";
                load();
            }

            function enqueueUpload(f) {
                uploadsPending++;
                var fd = new FormData();
                fd.append("file", f);
                queue.push({
                    path: "/upload", method: "POST", timeout: 610000, body: fd,
                    start: function () {
                        busy = 1;
                        fill.style.width = "0";
                        s("Uploading " + f.name + "...");
                    },
                    progress: function (e) {
                        if (!e.lengthComputable) return;
                        var pct = Math.round((100 * e.loaded) / e.total);
                        fill.style.width = pct + "%";
                        s(pct === 100 ? "Saving " + f.name + " on device..." :
                            "Uploading " + f.name + "... " + pct + "%" +
                            (uploadsPending > 1 ? " (" + (uploadsPending - 1) + " queued)" : ""));
                    },
                    finish: function (x, reason) {
                        busy = 0;
                        uploadsPending--;
                        if (reason === "load" && x.status === 200) {
                            fill.style.width = "100%";
                            s(f.name + " uploaded" + (uploadsPending ?
                                " \u2014 " + uploadsPending + " remaining" : ""), "ok");
                        } else {
                            fill.style.width = "0";
                            s("Upload failed: " + (reason === "load" ?
                                (x.responseText || "server error") : reason === "timeout" ?
                                "request timed out" : reason === "abort" ? "request cancelled" : "network error"), "err");
                        }
                    }
                });
            }

            function calibrateTime() {
                if (!ready()) return;
                var now = new Date();
                function pad(n) { return (n < 10 ? "0" : "") + n; }
                var local = now.getFullYear() + "-" + pad(now.getMonth() + 1) +
                    "-" + pad(now.getDate()) + "T" + pad(now.getHours()) +
                    ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
                queue.push({
                    path: "/time", method: "POST", timeout: 5000,
                    contentType: "text/plain", body: local,
                    finish: function (x, reason) {
                        var ok = reason === "load" && x.status === 200;
                        timeStatus.textContent = ok ? "Device time set from this browser" :
                            "Device time could not be set";
                        timeStatus.className = ok ? "" : "err";
                        timeReady = true;
                        load();
                    }
                });
                pump();
            }

            // drag and drop
            drop.ondragover = drop.ondragenter = function (e) {
                e.preventDefault();
                drop.classList.add("over");
            };
            drop.ondragleave = function (e) {
                e.preventDefault();
                drop.classList.remove("over");
            };
            drop.ondrop = function (e) {
                e.preventDefault();
                drop.classList.remove("over");
                if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
            };

            // wait for page to fully load so the GET / TCP connection is
            // closed and the single-connection server can accept /time
            window.onload = function () {
                var fragment = window.location.hash.slice(1);
                if (fragment) authorize(fragment);
                else ready();
            };
        </script>
    </body>
</html>

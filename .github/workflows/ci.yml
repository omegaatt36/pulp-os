name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # host tests, rustfmt, clippy: the software side of `task acceptance`
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # installs the nightly pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: host
      - run: task fmt
      - run: task clippy
      # the upload browser tests execute assets/upload.html under node
      - run: task test

  # firmware build matrix, ELF / dependency-graph / memory-budget checks
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: firmware
          workspaces: |
            . -> target/accept/c61
            . -> target/accept/c61-wifi
            . -> target/accept/c61-partial
            . -> target/accept/c61-partial-wifi
      - run: task verify
